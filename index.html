<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Week at First Baptist</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    /* 16:9 stage matching the background image; everything inside scales with it */
    .stage {
      position: relative;
      width: min(100vw, 177.78vh);
      aspect-ratio: 16 / 9;
      container-type: size;
      background: url('desktop-calendar.png') center / cover no-repeat;
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0, 0, 0, 0.45) 100%);
    }

    /* Area below the "THIS WEEK AT FIRST BAPTIST" title baked into the image */
    .schedule {
      position: absolute;
      top: 25%;
      bottom: 5%;
      left: 7%;
      right: 5%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.6em;
      overflow: hidden;
      color: #fff;
      font-family: 'Inter', 'Arial Black', 'Helvetica Neue', sans-serif;
      font-size: 3.4cqw;
      line-height: 1.15;
      -webkit-font-smoothing: antialiased;
      text-shadow: 0 0.05em 0.2em rgba(0, 0, 0, 0.6);
    }

    .schedule-row {
      display: grid;
      grid-template-columns: 6.2em 1fr;
      column-gap: 0.6em;
    }

    .day {
      font-weight: 900;
    }

    .event {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="schedule">
<!-- SCHEDULE_START -->
      <div class="schedule-row">
        <div class="day">Monday</div>
        <div class="events">
          <div class="event">6:30 pm Small Group with Stan @ the Jacksons</div>
        </div>
      </div>

      <div class="schedule-row">
        <div class="day">Tuesday</div>
        <div class="events">
          <div class="event">11:00 am Small Group with Sandy @ FBC</div>
        </div>
      </div>

      <div class="schedule-row">
        <div class="day">Wednesday</div>
        <div class="events">
          <div class="event">10:30 am Bible Study</div>
          <div class="event">6:30 pm Small Group with Pastor @ FBC</div>
        </div>
      </div>

      <div class="schedule-row">
        <div class="day">Thursday</div>
        <div class="events">
          <div class="event">6:00 pm Small Group with Pat &amp; Sandy @ the McClanahans</div>
        </div>
      </div>

      <div class="schedule-row">
        <div class="day">Friday</div>
        <div class="events">
          <div class="event">6:00 pm Game Night</div>
        </div>
      </div>
<!-- SCHEDULE_END -->
    </div>
  </div>
  <script>
    // Busy weeks: shrink text until the schedule fits below the title.
    // Sizes are in cqw, so one fit holds at every screen size.
    document.fonts.ready.then(() => {
      const s = document.querySelector('.schedule');
      let size = 3.4;
      while (s.scrollHeight > s.clientHeight && size > 1.5) {
        size -= 0.1;
        s.style.fontSize = size + 'cqw';
      }
    });
  </script>
</body>
</html>
